
name: Build PyPath Backend APK

on:
  workflow_dispatch:
  push:
    branches:
      - backend-integration
    paths:
      - 'PyPath/**'
      - '.github/workflows/build-backend-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout backend-integration
        uses: actions/checkout@v4
        with:
          ref: backend-integration

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        working-directory: PyPath
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: PyPath
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PyPath-backend-integration-debug-apk
          path: PyPath/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
